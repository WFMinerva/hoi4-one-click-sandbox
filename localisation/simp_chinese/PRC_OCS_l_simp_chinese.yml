 PRC_OCS_adjust_subject_autonomy:0 "调整附庸自治度"
 PRC_OCS_adjust_subject_autonomy_desc:0 "作为宗主国：将所有附庸自治度降至集成傀儡（最低）；作为附庸：经宗主国将自身自治度提升至最高。§Y可重复点击。§!"
 PRC_OCS_improve_relations:0 "改善所有国家关系"
 PRC_OCS_improve_relations_desc:0 "与所有其他国家的关系好感大幅提升（正向好感修正，长期有效）。§Y可重复点击。§!"
 PRC_OCS_max_compliance:0 "殖民地顺从度拉满"
 PRC_OCS_max_compliance_desc:0 "本国控制的所有州顺从度拉满、抵抗归零（含占领区与殖民地）。§Y可重复点击。§!"
 PRC_OCS_unlock_special_rules:0 "解锁特殊规则"
 PRC_OCS_unlock_special_rules_desc:0 "解锁：志愿军、创建/加入阵营、间谍支持其他意识形态、女性飞行员、女性指挥官、女性国家领袖、神风特攻，以及对未造成紧张度的国家正当化战争目标（外交界面「正当化战争目标」按钮对所有目标可用）。注：租借法案为开局游戏规则，脚本不可更改；制造吞并借口请用独立决议「制造战争借口」。§Y可重复点击。§!"
 PRC_OCS_create_wargoals:0 "制造战争借口"
 PRC_OCS_create_wargoals_desc:0 "对所有其他国家制造吞并战争借口。注：外交界面「正当化战争目标」按钮的解锁已并入决议「解锁特殊规则」。§Y可重复点击。§!"
 PRC_OCS_set_build_lot:0 "选择建设档位"
 PRC_OCS_set_build_lot_desc:0 "选择每次点击建设决议时每州排队的建筑数量（每轮 5 座或 1 座）；对民用工厂、军用工厂与船坞生效。§Y可反复更改。§!"
