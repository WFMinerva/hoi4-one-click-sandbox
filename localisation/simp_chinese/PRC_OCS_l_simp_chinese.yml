l_simp_chinese:
 PRC_OCS_category:0 "开局一键爽玩"
 PRC_OCS_category_desc:0 "为非AI玩家国家提供科技、学说、军工机构、装备、编制、库存、部队增援、全国建设与特殊科研的一键开局功能。"
 PRC_OCS_initialize:0 "启动一键爽玩开局"
 PRC_OCS_initialize_desc:0 "所有非AI玩家国家：立即完成全部科技与预设学说、启用预设军种精神、为已登记的共享公司完成目标MIO特质路线，同时创建预设装备设计、8个师级编制和巨量装备库存。"
 PRC_OCS_resupply:0 "补充战略装备库存"
 PRC_OCS_resupply_desc:0 "再次向全部支持的陆空装备及与当前国家初始化分支相匹配的预设变体补充100万件，同时恢复政治点、指挥点和三军经验；不会重复创建科技、编制、顾问或装备设计。"
 PRC_OCS_reorganize_army:0 "统一改编现有陆军"
 PRC_OCS_reorganize_army_desc:0 "将当前国家已有的全部陆军师一次性改编为预设的“卫戍部队”。该操作会抹去原有装甲师、山地师、骑兵师、海军陆战队等编制差异，且不可自动恢复。§R仅在确实希望统一全军编制时执行。§!"
 PRC_OCS_unlock_all_shared_slots:0 "完全解锁本国建设槽"
 PRC_OCS_unlock_all_shared_slots_desc:0 "将本国拥有且控制的每个州的工业共享建设槽完全解锁至游戏硬上限§Y25个§!。各工业建设决议也会自动为相关州执行同样的槽位解锁，因此不要求必须先点击本决议。临时占领的敌国州不会被处理。"
 PRC_OCS_queue_transport_and_bases:0 "推进全国交通与基地建设"
 PRC_OCS_queue_transport_and_bases_desc:0 "仅在本国拥有且控制的州补足5级基础设施、10级空军基地，并将已有海军基地补至10级。临时占领区不处理。\n\n§Y部分国家拥有额外的专属建设分支；这些附加工程只会在适用国家执行，并继续遵守工业建设优先条件。铁路不处理。§!"
 PRC_OCS_queue_national_defenses:0 "构筑全国防御工事"
 PRC_OCS_queue_national_defenses_desc:0 "自动授予建设州级防空设施所需的基础防空科技，仅在本国拥有且控制的州补足5级防空设施，并在各省建设10级陆上要塞、沿海省份建设10级海岸要塞。临时占领区不处理。大国执行后会形成规模极大的建设队列。"
 PRC_OCS_queue_petrochemical_program:0 "建设全国石化与战略燃料储备体系"
 PRC_OCS_queue_petrochemical_program_desc:0 "自动授予合成炼油厂与储油罐所需的最低科技，并按最高优先级在本国拥有且控制的每个州即时将合成炼油厂和储油罐分别补足至原版上限3座。两类建筑逐座、独立检查槽位；能够建设多少就先建设多少，未完成州保留以后重试资格。"
 PRC_OCS_queue_coastal_dockyards:0 "扩建全国沿海造船工业"
 PRC_OCS_queue_coastal_dockyards_desc:0 "在本国拥有且控制、并已完成炼油厂与储油罐目标的沿海州中，按第三优先级逐座加入最多5座海军船坞。槽位不足时保留已完成的部分进度，释放槽位后可再次执行；不会处理临时占领区。"
 PRC_OCS_queue_coastal_dockyards_available_tt:0 "需要先执行决议§Y“建设全国石化与战略燃料储备体系”§!"
 PRC_OCS_queue_civilian_industry:0 "扩建全国民用工业体系"
 PRC_OCS_queue_civilian_industry_desc:0 "在本国拥有且控制、已完成石化目标且沿海州已完成船坞目标的州中，按第四优先级逐座加入最多5座民用工厂。槽位不足时保留部分进度并允许以后重试；不会处理临时占领区。"
 PRC_OCS_queue_civilian_industry_available_tt:0 "需要先执行决议§Y“建设全国石化与战略燃料储备体系”§!；沿海州还需要先执行§Y“扩建全国沿海造船工业”§!"
 PRC_OCS.1.t:0 "一键爽玩开局已完成"
 PRC_OCS.1.d:0 "繁琐的开局准备已经全部完成。\n\n全部科技与预设学说已经解锁，军官团、政府顾问和三军司令均已任命；四家军工机构已经完成特质配置，超夯陆空装备设计与八个36宽师编制也已建立。国家库存中现已拥有足以支撑大规模战争的装备与物资。"
 PRC_OCS.1.a:0 "开始我们的征程！"
 PRC_OCS.2.t:0 "建设空间全面开放"
 PRC_OCS.2.d:0 "随着土地整理、城市规划与工业区划工作的完成，本国拥有且控制地区原有的建设限制已被清除。新的厂区、仓储区和交通用地已经划定，国家建设计划不再受制于狭窄的工业空间。"
 PRC_OCS.2.a:0 "让每一寸土地都发挥作用！"
 PRC_OCS.3.t:0 "交通、基地与电网工程启动"
 PRC_OCS.3.d:0 "全国性的道路、机场与港口扩建工程已经启动。各地交通网络和军用基地将被提升至足以支撑大规模作战的水平。\n\n作为PRC专属配套工程，23座预设战略补给站将同步投入使用；满足工业建设优先条件的地区还将建设双轨制国家电网。临时占领区不会被纳入本轮建设。"
 PRC_OCS.3.a:0 "让交通动脉贯通全国！"
 PRC_OCS.4.t:0 "国家燃料体系开始成形"
 PRC_OCS.4.d:0 "合成燃料工厂与战略储油设施的建设已经在本国拥有且控制的地区展开。新的炼油设备、输送管线和地下储油设施将逐步投入使用，为陆军机械化、空军作战和海军行动提供稳定保障。"
 PRC_OCS.4.a:0 "让战争机器永不停歇！"
 PRC_OCS.5.t:0 "沿海船厂全面扩建"
 PRC_OCS.5.d:0 "本国控制下的沿海船坞、船台和配套工业区已经开始扩建。更多钢材、机械和熟练工人正在向造船基地集中，一批新的海军船厂将陆续投入生产。"
 PRC_OCS.5.a:0 "新的舰队将在这里诞生！"
 PRC_OCS.6.t:0 "全国工业建设热潮"
 PRC_OCS.6.d:0 "新的民用工厂建设计划已经下达至本国拥有且控制的地区。厂房、机床、发电设备和运输设施将被纳入统一规划，各地闲置的劳动力与资源也将被迅速组织起来。"
 PRC_OCS.6.a:0 "以工业建设国家！"
 PRC_OCS.7.t:0 "通用开局初始化已完成"
 PRC_OCS.7.d:0 "繁琐的开局准备已经全部完成。\n\n全部科技与预设学说已经解锁，军工机构已经完成特质配置，推荐陆空装备（包括坦歼、自火）设计与八个超夯36宽师编制也已建立。库存中现已拥有足以支撑大规模战争的装备与物资。"
 PRC_OCS.7.a:0 "直接开始战争！"
 PRC_OCS.8.t:0 "全军编制统一完成"
 PRC_OCS.8.d:0 "改编命令已经下达，当前国家全部现役陆军师均已转入“卫戍部队”编制。原有装甲、骑兵、山地、空降和两栖部队的模板差异已经取消。\n\n这项措施便于集中补充与统一指挥，但也意味着原有专业化部队需要日后重新组建。"
 PRC_OCS.8.a:0 "统一装备，统一指挥！"
 PRC_OCS.9.t:0 "全国防御体系开始构筑"
 PRC_OCS.9.d:0 "州级防空阵地、陆上永久要塞和沿海防御工事已经在本国拥有且控制的地区全面开工。重要城市、交通节点、边境方向和海岸登陆场将被纳入统一设防。\n\n大规模工事会显著增加建设队列，但也将把国家塑造成难以迅速攻破的堡垒。"
 PRC_OCS.9.a:0 "构筑不可逾越的防线！"
 PRC_OCS.10.t:0 "全国交通与基地建设启动"
 PRC_OCS.10.d:0 "本国拥有且控制地区的道路、机场和既有港口已经纳入统一扩建计划。交通网络与军用基地将被提升至足以支撑工业运输、部队调动和远程作战的水平。\n\n临时占领区不会被处理。"
 PRC_OCS.10.a:0 "打通国家的交通动脉！"
 PRC_OCS_raise_24_infantry_divisions:0 "组建24个满编主力纯步师"
 PRC_OCS_raise_24_infantry_divisions_desc:0 "在本国任一拥有且控制的州组建§Y24个§!预设“主力纯步师”。所有部队均以§Y100%人力、100%装备和完整初始训练度§!投入现役，并使用当前国家初始化时建立的对应编制版本；AI不会执行。\n\n§Y本决议可重复执行，每次完成后需等待1天。§!"
 PRC_OCS.11.t:0 "二十四个主力步兵师完成组建"
 PRC_OCS.11.d:0 "新的兵员、武器和保障物资已经集中到位。二十四个满编主力步兵师已在本国控制区完成编组，并以完整人力、装备和训练状态正式列入作战序列。"
 PRC_OCS.11.a:0 "立即投入作战！"
 PRC_OCS_complete_air_special_projects:0 "完成空军特殊科研项目"
 PRC_OCS_complete_air_special_projects_desc:0 "立即完成空军专精的全部§Y9个§!特殊科研项目（含雷达项目）：弹跳炸弹、地震炸弹、洲际轰炸机、空中母舰、喷气引擎、轴流式喷气引擎、超音速喷气机、直升机与机载雷达。各项目的完成奖励（科技、装备与模块解锁）与正常研究完全一致，并直接获得全部衍生科技。\n\n§Y本决议在当前国家只能执行一次，完成后永久隐藏；切换到尚未完成的玩家国家时仍可执行。§!"
 PRC_OCS_complete_land_special_projects:0 "完成陆军特殊科研项目"
 PRC_OCS_complete_land_special_projects_desc:0 "立即完成陆军专精的全部§Y9个§!特殊科研项目：喷火坦克、军用工程车、陆地巡洋舰、超重型榴弹炮、自行超重型榴弹炮、超重型列车炮、多装药大口径火炮、要塞网络与大口径动能穿甲弹。各项目的完成奖励与正常研究完全一致，并直接获得全部衍生科技。\n\n§Y本决议在当前国家只能执行一次，完成后永久隐藏；切换到尚未完成的玩家国家时仍可执行。§!"
 PRC_OCS_complete_naval_special_projects:0 "完成海军特殊科研项目"
 PRC_OCS_complete_naval_special_projects_desc:0 "立即完成海军专精的全部§Y19个§!特殊科研项目，涵盖巡洋潜艇、舰队潜艇、核潜艇、导弹潜艇、袖珍潜艇、AIP引擎、消声瓦、潜水母舰、雷击巡洋舰、超级战列舰、现代主力舰、冰航母与各类辅助舰艇技术。各项目的完成奖励与正常研究完全一致，并直接获得全部衍生科技。\n\n§Y本决议在当前国家只能执行一次，完成后永久隐藏；切换到尚未完成的玩家国家时仍可执行。§!"
 PRC_OCS_complete_nuclear_special_projects:0 "完成核能特殊科研项目"
 PRC_OCS_complete_nuclear_special_projects_desc:0 "立即完成核能专精的全部§Y6个§!特殊科研项目：核反应堆、商用核反应堆、核能引擎、核弹、热核弹与核弹头。各项目的完成奖励（含首枚核弹与核能科技）与正常研究完全一致，直接获得全部衍生科技（含离心法同位素分离），并在首都额外补建§Y1座核反应堆§!以替代正常研究时设施州自动获得的反应堆。\n\n§Y本决议在当前国家只能执行一次，完成后永久隐藏；切换到尚未完成的玩家国家时仍可执行。§!"
 PRC_OCS_complete_rocket_special_projects:0 "完成火箭特殊科研项目"
 PRC_OCS_complete_rocket_special_projects_desc:0 "立即完成火箭专精的全部§Y6个§!特殊科研项目：飞行炸弹、弹道导弹、中程弹道导弹、远程弹道导弹、地空导弹与火箭截击机。各项目的完成奖励与正常研究完全一致，并直接获得全部衍生科技。\n\n§Y本决议在当前国家只能执行一次，完成后永久隐藏；切换到尚未完成的玩家国家时仍可执行。§!"
 PRC_OCS.12.t:0 "特殊科研项目完成"
 PRC_OCS.12.d:0 "本国科研团队宣布，该领域的特殊科研项目已经全部完成。\n\n相关科技成果、装备设计与生产许可均已并入国家体系。正常研究过程中附带的科学家经验与试验事件不会通过本决议获得。"
 PRC_OCS.12.a:0 "科学的胜利！"
 PRC_OCS_evolve_special_project_forces:0 "进化特殊科研陆军编制"
 PRC_OCS_evolve_special_project_forces_desc:0 "所有非AI玩家国家均可使用。在§Y喷火坦克§!、§Y军用工程车§!、§Y直升机§!、§Y洲际轰炸机§!、§Y空天母舰§!与§Y轴流式喷气引擎§!项目及相关科技完成后，创建4个独立的二阶段编制：“司令部”“装甲师·进化型”“海军陆战队装甲师·进化型”和“主力步坦师·进化型”；主力步坦师与师名组使用当前国家对应的初始化分支。同时创建最终“中型喷火坦克 III型”、全5升级“改进型履带登陆车”、4个角色不同的全5升级“装甲支援车”，以及4种全5升级特殊轰炸机；存在适用的预设航空军工机构时，4种飞机自动选用该机构。\n\n§Y旧装备设计会退役；原有师级模板和现役单位不会被删除或自动改编。本决议在当前国家完成后永久隐藏；切换到尚未完成的玩家国家时仍可执行。§!"
 PRC_OCS.13.t:0 "特殊科研陆军完成进化"
 PRC_OCS.13.d:0 "新一代司令部、装甲师、两栖装甲师与步坦师编制已经建立。中型喷火坦克 III型、改进型履带登陆车、四种装甲支援车及四种特殊轰炸机的最终设计也已列入生产目录，旧装备设计已经退役。\n\n原有师级编制和现役部队保持不变；是否改编或新建部队，由指挥官自行决定。"
 PRC_OCS.13.a:0 "让新编制接受战场检验！"
 PRC_OCS_add_points:0 "补充政治点数、指挥点数与军种经验"
 PRC_OCS_add_points_desc:0 "给予§Y99999§!政治点数、§Y100§!指挥点数与各军种§Y999§!经验——即此前捆绑在“一键开局”与“补充库存”决议中的点数。本决议可反复点击，随时补充。"
 PRC_OCS_create_intelligence_agency:0 "一键组建间谍机构"
 PRC_OCS_create_intelligence_agency_desc:0 "立即为当前玩家国家组建间谍机构，§Y无需任何科技与国策前置§!——落笔即成，情报网当场就位。\n\n§Y仅玩家国家可用。本决议在当前国家只能执行一次，完成后永久隐藏；切换到尚未组建机构的玩家国家时仍可执行。§!"
 PRC_OCS_create_intelligence_agency_effect:0 "§Y间谍机构已组建。§!"
 PRC_OCS_unlock_all_agency_upgrades:0 "一键升满机构部门"
 PRC_OCS_unlock_all_agency_upgrades_desc:0 "将间谍机构五大部门一次性拉满：§Y情报§!、§Y防御§!、§Y行动§!、§Y特工训练§!、§Y密码破译§!——§Y全部§!升级即刻到顶。\n\n§Y需先拥有间谍机构，仅玩家国家可用。切换国家后可再次执行，全程无成本、无等待。§!"
 PRC_OCS_unlock_all_agency_upgrades_effect:0 "§Y全部部门升级已完成。§!"
 PRC_OCS_choose_air_special_project_bonuses:0 "选择空军特殊科研原型奖励"
 PRC_OCS_choose_air_special_project_bonuses_desc:0 "在“一键完成空军特殊科研”之后，可像正常研究时那样逐一选择互斥的原型产物奖励：§Y喷气引擎§!（战斗机/折中/轰炸机）、§Y轴流式喷气引擎§!（战斗机/折中/轰炸机）与§Y超音速战斗机§!（削价减性能/均衡/加价增性能）。每组每国只可选定一次，选定后不可更改或重复。\n\n§Y需先通过“完成空军特殊科研项目”完成空军专精。仅玩家国家可用。§!"
 PRC_OCS_choose_land_special_project_bonuses:0 "选择陆军特殊科研原型奖励"
 PRC_OCS_choose_land_special_project_bonuses_desc:0 "在“一键完成陆军特殊科研”之后，可像正常研究时那样逐一选择剩余的互斥原型产物奖励：§Y要塞网络§!的奖励（混凝土加固一、混凝土加固二与通信系统改造）。每组每国只可选定一次，选定后不可更改或重复。\n\n§Y需先通过“完成陆军特殊科研项目”完成陆军专精。仅玩家国家可用。§!"
 PRC_OCS_choose_naval_special_project_bonuses:0 "选择海军特殊科研原型奖励"
 PRC_OCS_choose_naval_special_project_bonuses_desc:0 "在“一键完成海军特殊科研”之后，可像正常研究时那样逐一选择互斥的原型产物奖励：§Y巡洋潜艇§!（航程/鱼雷）、§Y舰队潜艇§!（攻击与隐蔽/可靠与防护）与§Y雷击巡洋舰§!（鱼雷/副炮）。每组每国只可选定一次，选定后不可更改或重复。\n\n§Y需先通过“完成海军特殊科研项目”完成海军专精。仅玩家国家可用。§!"
 PRC_OCS_choose_nuclear_special_project_bonuses:0 "选择核能特殊科研原型奖励"
 PRC_OCS_choose_nuclear_special_project_bonuses_desc:0 "在“一键完成核能特殊科研”之后，可像正常研究时那样逐一选择剩余的互斥原型产物奖励：§Y同位素分离§!奖励（气体扩散或离心分离）与§Y反应堆测试完成§!奖励（保密处理或向公众公开）。每组每国只可选定一次，选定后不可更改或重复。\n\n§Y需先通过“完成核能特殊科研项目”完成核能专精。仅玩家国家可用。§!"
 PRC_OCS.14.t:0 "空军原型奖励选择"
 PRC_OCS.14.d:0 "原型团队已整理完毕阶段性成果。正常研究过程中出现的互斥奖励正在等待分派——请选择最适合我国战争机器的方向。"
 PRC_OCS.14.a:0 "喷气引擎原型（战斗机/均衡/轰炸机）"
 PRC_OCS.14.b:0 "轴流式喷气引擎原型（战斗机/均衡/轰炸机）"
 PRC_OCS.14.c:0 "超音速战斗机原型（减价/均衡/高性能）"
 PRC_OCS.14.e:0 "继续选择剩余空军原型奖励"
 PRC_OCS.15.t:0 "喷气引擎原型方向"
 PRC_OCS.15.d:0 "首轮喷气引擎原型因调校方向不同而表现各异。工程师提出三个互斥方向——请选择与我国战略相契合的一项。"
 PRC_OCS.15.a:0 "战斗机向：速度与机动+5%，造价-5%"
 PRC_OCS.15.b:0 "折中向：喷气机可靠性全面+3%"
 PRC_OCS.15.c:0 "轰炸机向：对地攻击与航程+5%，造价-5%"
