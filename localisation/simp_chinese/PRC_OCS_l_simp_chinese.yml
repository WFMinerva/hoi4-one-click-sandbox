l_simp_chinese:
 PRC_OCS_category:0 "开局一键爽玩"
 PRC_OCS_category_desc:0 "为非AI玩家国家提供科技、学说、军工机构、装备、编制、库存、部队增援、全国建设与特殊科研的一键开局功能。"
 PRC_OCS_add_stockpile:0 "获得巨量装备库存"
 PRC_OCS_add_stockpile_desc:0 "向全部支持的陆空装备及与当前国家初始化分支相匹配的预设变体各补充100万件库存；若已完成「进化特殊科研陆军编制」，直升机、装甲支援车与中型喷火坦克 III型也一并补充。不会创建科技、编制或装备设计。§Y需先执行「创建预设装备设计」后可用；可重复点击补充。§!"
 PRC_OCS_create_preset_designs:0 "创建预设装备设计"
 PRC_OCS_create_preset_designs_desc:0 "创建预设装备设计与师级编制（含全部预设变体与8个师级编制模板）；不会补充库存。§Y每国仅可执行一次。§!"
 PRC_OCS_max_stability:0 "稳定度与战争支援拉满"
 PRC_OCS_max_stability_desc:0 "稳定度与战争支援直接各增加500点（必定为满值）；独立于一键开局，不改变其他任何内容。§Y可重复点击。§!"
 PRC_OCS_queue_arms_factories:0 "一键铺设全国军工厂"
 PRC_OCS_queue_arms_factories_desc:0 "在本国每一座拥有且控制的州排队建设军用工厂（每州每轮 5 座，可重复点击至每州 20 座上限）；需先完成石化与燃料储备目标。§Y可重复点击补充。§!"
 PRC_OCS_queue_arms_factories_available_tt:0 "至少有一座拥有且控制的州尚未完成军工厂目标（需先完成石化与燃料储备目标）"
 PRC_OCS_boost_construction:0 "一键加速全国建设"
 PRC_OCS_boost_construction_desc:0 "全国所有在建与新建项目（铁路/雷达站/火箭基地/要塞/海岸炮/基础设施/机场/港口/军工厂/民用工厂/船坞/补给站/电网/核反应堆/燃料库/合成炼油厂）建造速度提升 5000%，持续 365 天。§Y不自动铺满建筑、可重复点击叠加。§!"
 PRC_OCS_queue_major_structures:0 "一键建设大型设施"
 PRC_OCS_queue_major_structures_desc:0 "在本国每一座拥有且控制的州建设核反应堆与民用核反应堆（每州各 1 座，民用优先）与沿海海军补给中心（每沿海省 1 座）。§Y陆地要塞已拆分为独立决议「一键建设要塞群」；每国一次。§!"
 PRC_OCS_queue_fortresses:0 "一键建设要塞群"
 PRC_OCS_queue_fortresses_desc:0 "在本国每一座拥有且控制的州建设陆地要塞（每省至 10 级）。§Y每国一次。§!"
 PRC_OCS_set_economy_law:0 "一键更换经济法案"
 PRC_OCS_set_economy_law_desc:0 "弹出经济法案菜单，任意选择并立即生效；§Y可反复点击随便改。§!"
 PRC_OCS_set_trade_law:0 "一键更换外贸法案"
 PRC_OCS_set_trade_law_desc:0 "弹出外贸法案菜单，任意选择并立即生效；§Y可反复点击随便改。§!"
 PRC_OCS_set_conscription_law:0 "一键更换征兵法案"
 PRC_OCS_set_conscription_law_desc:0 "弹出征兵法案菜单，任意选择并立即生效；§Y可反复点击随便改。§!"
 PRC_OCS_max_ideology_support:0 "意识形态支持度拉满并更换国体"
 PRC_OCS_max_ideology_support_desc:0 "弹出菜单：每个意识形态可单独选择「拉满支持度」或「切换国体」。§Y切换国体可能中断进行中的国策；可重复点击。§!"
