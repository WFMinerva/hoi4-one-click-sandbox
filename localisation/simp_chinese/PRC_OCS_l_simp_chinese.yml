 PRC_OCS.17.d:0 "超音速飞行将机体性能推向极限。设计师给出三条互斥路线——每一条都以不同的性能与造价组合作为取舍。"
 PRC_OCS.17.a:0 "减造价：造价-10%，速度与航程-5%，可靠性-10%"
