l_english:
 PRC_OCS_category:0 "One-Click Sandbox Start"
 PRC_OCS_category_desc:0 "One-click technology, doctrine, MIO, equipment, template, stockpile, reinforcement, construction and special-project tools for human-controlled countries."
 PRC_OCS_initialize:0 "Launch One-Click Sandbox Start"
 PRC_OCS_initialize_desc:0 "For every human-controlled country: completes all technologies and preset doctrines, applies the preset service spirits, completes target MIO trait routes for registered shared companies, and creates preset equipment designs, eight division templates and a massive stockpile."
 PRC_OCS_resupply:0 "Replenish Strategic Equipment Stockpile"
 PRC_OCS_resupply_desc:0 "Adds another one million units of every supported land and air equipment type and the preset variants matching the current-country initialization branch, while replenishing political power, command power and service experience. Technologies, templates, advisers and designs are not recreated."
 PRC_OCS_reorganize_army:0 "Reorganize Existing Army"
 PRC_OCS_reorganize_army_desc:0 "Converts every existing division of the current country to the preset Garrison Force template. This removes the distinctions of existing armored, mountain, cavalry, marine and other specialized formations and cannot be automatically reversed. §ROnly use it when you deliberately want a uniform army.§!"
 PRC_OCS_skull_divisions:0 "One-Click Skull Divisions"
 PRC_OCS_skull_divisions_desc:0 "Issues an extreme intensified training order: every active and newly raised army and navy formation gains massive passive experience during this period — §Yno exercise status required§! — and training quality rushes straight to fully trained skull divisions.\n\n§RNote: while the game is paused (time frozen), no experience accumulates and the effect does not apply§!. Keep time flowing (e.g. at maximum speed) for several days and the whole army will reach full quality.\n\n§YNo one-click start needed. Lasts 7 days and can be re-applied; the AI will never use it.§!"
 PRC_OCS_skull_divisions_idea:0 "§YExtreme intensified training underway: every active and newly raised formation keeps gaining massive passive experience (time must keep flowing; paused = no gain), approaching fully trained skull divisions.§!"
 PRC_OCS.53.t:0 "Extreme Intensified Training Order Issued"
 PRC_OCS.53.d:0 "The extreme intensified training order has been issued. Active and newly raised army and navy formations keep gaining massive passive experience. §YKeep time flowing (nothing accumulates while paused)§! and the whole army will soon reach fully trained skull division quality. Lasts 7 days and can be re-applied."
 PRC_OCS.53.a:0 "Let the skull divisions sweep the field!"
 PRC_OCS_unlock_all_shared_slots:0 "Fully Unlock National Building Slots"
 PRC_OCS_unlock_all_shared_slots_desc:0 "Fully unlocks the shared industrial building slots of every state both owned and controlled by the current country to the engine hard cap of §Y25§!. Industrial construction decisions perform the same unlock automatically. Temporarily occupied enemy states are excluded."
 PRC_OCS_queue_transport_and_bases:0 "Develop National Transport and Bases"
 PRC_OCS_queue_transport_and_bases_desc:0 "Only in states both owned and controlled by the current country, develops infrastructure to level 5, air bases to level 10, and existing naval bases to level 10. Occupied enemy territory is excluded.\n\n§YSome countries have additional country-specific construction branches. These projects run only where applicable and continue to respect the industrial construction priority rules. Railways are not modified.§!"
 PRC_OCS_queue_national_defenses:0 "Construct Nationwide Defenses"
 PRC_OCS_queue_national_defenses_desc:0 "Grants the basic technology required for state anti-air, then only in states both owned and controlled by the current country develops state anti-air to level 5, land forts to level 10 in every province, and coastal forts to level 10 in coastal provinces. Occupied enemy territory is excluded. Large countries will receive a very large construction queue."
 PRC_OCS_queue_petrochemical_program:0 "National Petrochemical and Fuel Reserve Program"
 PRC_OCS_queue_petrochemical_program_desc:0 "Grants the minimum technologies required for synthetic refineries and fuel silos, then immediately fills both buildings to their vanilla cap of three in every state both owned and controlled by the current country. Each level checks its own slot independently, so partial progress is retained."
 PRC_OCS_queue_coastal_dockyards:0 "Expand Coastal Shipbuilding Industry"
 PRC_OCS_queue_coastal_dockyards_desc:0 "In coastal states both owned and controlled by the current country that have completed both petrochemical targets, queues up to five dockyards one at a time as the third shared-slot priority. Partial progress is retained, and occupied enemy territory is excluded."
 PRC_OCS_queue_coastal_dockyards_available_tt:0 "First execute the §Y“National Petrochemical and Fuel Reserve Program”§! decision"
 PRC_OCS_queue_civilian_industry:0 "Expand the National Civilian Industry"
 PRC_OCS_queue_civilian_industry_desc:0 "In states both owned and controlled by the current country that have completed the petrochemical targets—and, for coastal states, the dockyard target—queues up to five civilian factories one at a time as the fourth shared-slot priority. Occupied enemy territory is excluded."
 PRC_OCS_queue_civilian_industry_available_tt:0 "First execute the §Y“National Petrochemical and Fuel Reserve Program”§! decision; coastal states also require the §Y“Expand Coastal Shipbuilding Industry”§! decision"
 PRC_OCS.1.t:0 "One-Click Sandbox Start Complete"
 PRC_OCS.1.d:0 "The tedious opening preparations are complete.\n\nAll technologies and preset doctrines have been unlocked; the officer corps, government advisers and service chiefs have been appointed; the four MIOs have completed their configured trait routes; and powerful land and air equipment designs and eight 36-width division templates have been created. The national stockpile now contains enough equipment and materiel to sustain a large-scale war."
 PRC_OCS.1.a:0 "Begin our campaign!"
 PRC_OCS.2.t:0 "All Building Space Opened"
 PRC_OCS.2.d:0 "Land surveys, urban planning and industrial zoning have removed the old construction restrictions from states both owned and controlled by the country. New factory districts, storage zones and transport sites are now available."
 PRC_OCS.2.a:0 "Put every tract of land to work!"
 PRC_OCS.3.t:0 "Transport, Bases and Grids Underway"
 PRC_OCS.3.d:0 "Road, airfield and port expansion has begun across the country. Transport networks and military bases will be developed to support large-scale operations.\n\nAs PRC-only supporting projects, the 23 preset strategic supply hubs will enter service, and eligible regions will receive the dual-grid system after higher-priority industry is complete. Occupied enemy territory is excluded."
 PRC_OCS.3.a:0 "Connect the nation!"
 PRC_OCS.4.t:0 "The National Fuel System Takes Shape"
 PRC_OCS.4.d:0 "Synthetic fuel plants and strategic storage facilities are being developed throughout states both owned and controlled by the country, securing the fuel required by the mechanized army, air force and navy."
 PRC_OCS.4.a:0 "Keep the war machine running!"
 PRC_OCS.5.t:0 "Coastal Shipyards Expanded"
 PRC_OCS.5.d:0 "Shipyards, slipways and supporting industrial districts in our owned and controlled coastal states are being expanded. New naval dockyards will soon enter production."
 PRC_OCS.5.a:0 "A new fleet will be born here!"
 PRC_OCS.6.t:0 "A Nationwide Industrial Boom"
 PRC_OCS.6.d:0 "A civilian factory program has been issued across states both owned and controlled by the country. Workshops, machinery and transport facilities will be organized under a unified plan."
 PRC_OCS.6.a:0 "Build the nation through industry!"
 PRC_OCS.7.t:0 "Generic Opening Initialization Complete"
 PRC_OCS.7.d:0 "The tedious opening preparations are complete.\n\nAll technologies and preset doctrines have been unlocked, MIO trait configurations are complete, and the recommended land and air equipment designs—including tank destroyers and self-propelled artillery—and eight powerful 36-width division templates have been created. The stockpile now contains enough equipment and materiel to sustain a large-scale war."
 PRC_OCS.7.a:0 "Begin the war!"
 PRC_OCS.8.t:0 "Army Reorganization Complete"
 PRC_OCS.8.d:0 "The reorganization order has been carried out. Every active army division now uses the preset Garrison Force template, and the former distinctions between armored, cavalry, mountain, airborne and amphibious formations have been removed.\n\nStandardization will simplify reinforcement and command, but specialized formations will have to be rebuilt later."
 PRC_OCS.8.a:0 "Standardize equipment and command!"
 PRC_OCS.9.t:0 "Nationwide Defenses Under Construction"
 PRC_OCS.9.d:0 "State anti-air positions, permanent land forts and coastal defenses are now under construction throughout states both owned and controlled by the country. Cities, transport nodes, frontier sectors and landing grounds will be incorporated into a unified defense plan."
 PRC_OCS.9.a:0 "Build an unbreakable defensive line!"
 PRC_OCS.10.t:0 "National Transport and Base Program Underway"
 PRC_OCS.10.d:0 "Roads, airfields and existing ports in states both owned and controlled by the country are now part of a unified expansion plan. The network will support industrial transport, troop movements and long-range operations.\n\nOccupied enemy territory is excluded."
 PRC_OCS.10.a:0 "Open the national arteries!"
 PRC_OCS_raise_24_infantry_divisions:0 "Raise 24 Full-Strength Main Infantry Divisions"
 PRC_OCS_raise_24_infantry_divisions_desc:0 "Raises §Y24§! divisions using the preset Main Infantry Division template in one state both owned and controlled by the country. Every division enters service with §Y100% manpower, 100% equipment and full starting training§!, using the version created by the current-country initialization branch. The AI cannot use this decision.\n\n§YThis decision is repeatable with a one-day re-enable delay.§!"
 PRC_OCS.11.t:0 "Twenty-Four Main Infantry Divisions Raised"
 PRC_OCS.11.d:0 "Recruits, weapons and supporting materiel have been assembled. Twenty-four full-strength main infantry divisions have completed formation in controlled territory and entered the order of battle with full manpower, equipment and training."
 PRC_OCS.11.a:0 "Commit them to battle!"
 PRC_OCS_complete_air_special_projects:0 "Complete Air Special Projects"
 PRC_OCS_complete_air_special_projects_desc:0 "Instantly completes all §Y9§! special projects of the air specialization (including the radar project): bouncing bomb, earthshaker bomb, intercontinental bomber, mothership aircraft, jet engine, axial jet engine, supersonic jet, helicopter and airborne radar. Each project's completion rewards (technologies, equipment and module unlocks) are identical to normal research, and all derived technologies are granted directly.\n\n§YThis decision can be used once by the current country and then disappears; it remains available after switching to a player country that has not completed it.§!"
 PRC_OCS_complete_land_special_projects:0 "Complete Land Special Projects"
 PRC_OCS_complete_land_special_projects_desc:0 "Instantly completes all §Y9§! special projects of the land specialization: flamethrower tank, military engineering vehicles, land cruiser, super-heavy howitzer, self-propelled super-heavy howitzer, super-heavy railway gun, multi-charge large-caliber gun, stronghold network and large-caliber kinetic energy sabot. Each project's completion rewards are identical to normal research, and all derived technologies are granted directly.\n\n§YThis decision can be used once by the current country and then disappears; it remains available after switching to a player country that has not completed it.§!"
 PRC_OCS_complete_naval_special_projects:0 "Complete Naval Special Projects"
 PRC_OCS_complete_naval_special_projects_desc:0 "Instantly completes all §Y19§! special projects of the naval specialization, covering cruiser, fleet, nuclear and missile submarines, midget submarines, AIP engines, anechoic tiles, submarine carriers, torpedo cruisers, super-heavy and modern capital ships, the ice carrier and auxiliary vessel technologies. Each project's completion rewards are identical to normal research, and all derived technologies are granted directly.\n\n§YThis decision can be used once by the current country and then disappears; it remains available after switching to a player country that has not completed it.§!"
 PRC_OCS_complete_nuclear_special_projects:0 "Complete Nuclear Special Projects"
 PRC_OCS_complete_nuclear_special_projects_desc:0 "Instantly completes all §Y6§! special projects of the nuclear specialization: nuclear reactor, commercial nuclear reactor, nuclear engines, nuclear bomb, thermonuclear bomb and nuclear warheads. Completion rewards (including the first free nuclear bomb and nuclear technologies) are identical to normal research, all derived technologies (including centrifugal isotope separation) are granted directly, and §Y1 additional nuclear reactor§! is built in the capital to replace the one a research facility would normally receive.\n\n§YThis decision can be used once by the current country and then disappears; it remains available after switching to a player country that has not completed it.§!"
 PRC_OCS_complete_rocket_special_projects:0 "Complete Rocket Special Projects"
 PRC_OCS_complete_rocket_special_projects_desc:0 "Instantly completes all §Y6§! special projects of the rocket specialization: flying bomb, ballistic missile, medium-range ballistic missile, long-range ballistic missile, ground-to-air missile and rocket interceptor. Each project's completion rewards are identical to normal research, and all derived technologies are granted directly.\n\n§YThis decision can be used once by the current country and then disappears; it remains available after switching to a player country that has not completed it.§!"
 PRC_OCS.12.t:0 "Special Projects Complete"
 PRC_OCS.12.d:0 "Our research teams report that every special project in this field has been completed.\n\nThe resulting technologies, equipment designs and production licenses have been integrated into the national war effort. Scientist experience and trial events attached to the normal research process are not granted by this decision."
 PRC_OCS.12.a:0 "A triumph of science!"
 PRC_OCS_evolve_special_project_forces:0 "Evolve Special-Project Army Templates"
 PRC_OCS_evolve_special_project_forces_desc:0 "Available to every human-controlled country. After the §YFlamethrower Tank§!, §YMilitary Engineering Vehicles§!, §YHelicopter§!, §YIntercontinental Bomber§!, §YMothership Aircraft§! and §YAxial Jet Engine§! projects and their relevant technologies are complete, creates four separate second-stage templates: Headquarters, Evolved Armored Division, Evolved Armored Marine Division and Evolved Main Infantry-Tank Division. The Main Infantry-Tank template and division-name groups follow the current-country initialization branch. It also creates the final Medium Flame Tank III, a fully upgraded Improved Amphibious Tractor, four role-distinct fully upgraded Armored Support Vehicles, and four fully upgraded special bombers. The aircraft use the applicable preset aviation MIO when it exists.\n\n§YOlder equipment designs are retired. Existing division templates and active units are neither deleted nor automatically converted. This decision disappears after the current country completes it; it remains available after switching to a player country that has not completed it.§!"
 PRC_OCS.13.t:0 "Special-Project Army Evolution Complete"
 PRC_OCS.13.d:0 "The new headquarters, armored, amphibious armored and infantry-tank templates are now available. The final Medium Flame Tank III, Improved Amphibious Tractor, four specialized armored support vehicles and four special bombers have entered the production catalogue, while their older equipment designs have been retired.\n\nExisting division templates and active units remain unchanged; their conversion or replacement is left to the commander."
 PRC_OCS.13.a:0 "Put the new formations to the test!"
 PRC_OCS_add_points:0 "Replenish Political Power, Command Power and Service Experience"
 PRC_OCS_add_points_desc:0 "Grants §Y99,999§! political power, §Y100§! command power and §Y999§! in each service experience—the points that were previously bundled inside the One-Click Sandbox Start and Replenish Stockpile decisions. This decision can be used repeatedly whenever you need more."
 PRC_OCS_develop_occupied_territory:0 "Develop Occupied Territory"
 PRC_OCS_develop_occupied_territory_desc:0 "Instantly develops every occupied enemy state (controlled but not owned by the current country): infrastructure to §Y5§!, state anti-air to §Y5§!, air bases to §Y10§!, and existing naval bases to §Y10§!. Grants the basic anti-air technology automatically. Industrial facilities are deliberately excluded because non-core production penalties make them uneconomical in occupied territory.\n\n§YPlayer countries only. This decision is repeatable with a one-day re-enable delay; states that already meet the targets are skipped automatically.§!"
 PRC_OCS_boost_supply_construction:0 "Boost Supply Hub Construction"
 PRC_OCS_boost_supply_construction_desc:0 "Accelerates §YSupply Hub§! construction speed by §Y+1000%§! for one year by redirecting building materials and railway workers, modeled on the vanilla “Reorganize the Railway System” decision. The bonus lasts §Y365 days§! and can be re-applied at any time.\n\n§YPlayer countries only.§!"
 PRC_OCS_create_intelligence_agency:0 "One-Click: Found Intelligence Agency"
 PRC_OCS_create_intelligence_agency_desc:0 "Immediately founds an intelligence agency for the current player country. §YNo technology and no national focus are required§! — the network is up and running the moment you click.\n\n§YPlayer countries only. This decision can be used once by the current country and then disappears; it remains available after switching to a player country that has not founded one yet.§!"
 PRC_OCS_create_intelligence_agency_effect:0 "§YIntelligence agency founded.§!"
 PRC_OCS_unlock_all_agency_upgrades:0 "One-Click: Max Out Agency Departments"
 PRC_OCS_unlock_all_agency_upgrades_desc:0 "Pushes every department of your intelligence agency straight to its highest level: §YIntelligence§!, §YDefense§!, §YOperations§!, §YAgent Training§! and §YCodebreaking§! — all §Yfive§! fully upgraded at once.\n\n§YRequires an existing intelligence agency. Player countries only. It remains available after switching to a player country that has not completed it—and nothing here costs you a thing.§!"
 PRC_OCS_unlock_all_agency_upgrades_effect:0 "§YAll agency departments fully upgraded.§!"
 PRC_OCS_choose_air_special_project_bonuses:0 "Pick Air Special-Project Prototype Bonuses"
 PRC_OCS_choose_air_special_project_bonuses_desc:0 "After the one-click air completion, lets you pick each mutually exclusive prototype-reward bonus one by one, exactly as during normal research: the §YJet Engine§! (fighter/compromise/bomber), the §YAxial Jet Engine§! (fighter/compromise/bomber) and the §YSupersonic Jet§! (cheaper but weaker / balanced / stronger but costlier). Each group is picked once per player country and cannot be re-picked.\n\n§YRequires the air special projects to be completed first via “Complete Air Special Projects”. Player countries only.§!"
 PRC_OCS_choose_land_special_project_bonuses:0 "Pick Land Special-Project Prototype Bonuses"
 PRC_OCS_choose_land_special_project_bonuses_desc:0 "After the one-click land completion, lets you pick each remaining mutually exclusive prototype-reward bonus one by one, exactly as during normal research: the §YStronghold Network§! rewards (concrete reinforcement I, concrete reinforcement II and the communication system overhaul). Each group is picked once per player country and cannot be re-picked.\n\n§YRequires the land special projects to be completed first via “Complete Land Special Projects”. Player countries only.§!"
 PRC_OCS_choose_naval_special_project_bonuses:0 "Pick Naval Special-Project Prototype Bonuses"
 PRC_OCS_choose_naval_special_project_bonuses_desc:0 "After the one-click naval completion, lets you pick each mutually exclusive prototype-reward bonus one by one, exactly as during normal research: the §YCruiser Submarine§! (range / torpedo), the §YFleet Submarine§! (attack & stealth / reliability & protection) and the §YTorpedo Cruiser§! (torpedo / secondary battery). Each group is picked once per player country and cannot be re-picked.\n\n§YRequires the naval special projects to be completed first via “Complete Naval Special Projects”. Player countries only.§!"
 PRC_OCS_choose_nuclear_special_project_bonuses:0 "Pick Nuclear Special-Project Prototype Bonuses"
 PRC_OCS_choose_nuclear_special_project_bonuses_desc:0 "After the one-click nuclear completion, lets you pick each remaining mutually exclusive prototype-reward bonus one by one, exactly as during normal research: the §YIsotope Separation§! reward (gaseous or centrifugal) and the §YReactor Tested§! reward (classify the results or public reveal). Each group is picked once per player country and cannot be re-picked.\n\n§YRequires the nuclear special projects to be completed first via “Complete Nuclear Special Projects”. Player countries only.§!"
 PRC_OCS.14.t:0 "Air Prototype Bonus Selection"
 PRC_OCS.14.d:0 "The prototype teams are ready to hand over their findings. Each mutually exclusive reward from the normal research process is waiting to be assigned—choose the focus that suits our war machine."
 PRC_OCS.14.a:0 "Jet Engine prototypes (fighter / balance / bomber)"
 PRC_OCS.14.b:0 "Axial Jet Engine prototypes (fighter / balance / bomber)"
 PRC_OCS.14.c:0 "Supersonic Jet prototypes (cost / balance / quality)"
 PRC_OCS.14.e:0 "Continue with the remaining air prototype bonuses"
 PRC_OCS.15.t:0 "Jet Engine Prototype Focus"
 PRC_OCS.15.d:0 "The first jet engine prototypes performed differently depending on how we tuned them. Our engineers propose three mutually exclusive directions—choose the one that matches our strategy."
 PRC_OCS.15.a:0 "Fighter focus: +5% speed and agility, -5% cost"
 PRC_OCS.15.b:0 "Compromise: +3% jet reliability across the board"
 PRC_OCS.15.c:0 "Bomber focus: +5% ground attack and range, -5% cost"
 PRC_OCS.16.t:0 "Axial Jet Engine Prototype Focus"
 PRC_OCS.16.d:0 "Axial-flow compressors unlocked another round of tuning. As before, the three directions are mutually exclusive—choose the one that fits our air doctrine."
 PRC_OCS.16.a:0 "Fighter focus: +3% speed and agility, -3% cost"
 PRC_OCS.16.b:0 "Compromise: +5% jet reliability across the board"
 PRC_OCS.16.c:0 "Bomber focus: +3% ground attack and range, -3% cost"
 PRC_OCS.17.t:0 "Supersonic Jet Prototype Focus"
 PRC_OCS.17.d:0 "Supersonic flight pushes airframes to their limits. Our designers present three mutually exclusive paths—each trades a different mix of performance and cost."
 PRC_OCS.17.a:0 "Cost reduction: -10% cost, -5% speed & range, -10% reliability"
 PRC_OCS.17.b:0 "Compromise: +3% jet reliability"
 PRC_OCS.17.c:0 "Quality over cost: +10% cost, +5% agility & defense, +5% reliability"
 PRC_OCS.18.t:0 "Naval Prototype Bonus Selection"
 PRC_OCS.18.d:0 "The shipyards are ready to apply the prototype findings. Each mutually exclusive reward from the normal research process is waiting to be assigned—choose the focus that suits our fleet."
 PRC_OCS.18.a:0 "Cruiser Submarine prototypes (range / torpedo)"
 PRC_OCS.18.b:0 "Fleet Submarine prototypes (attack / reliability)"
 PRC_OCS.18.c:0 "Torpedo Cruiser prototypes (torpedo / secondary battery)"
 PRC_OCS.18.e:0 "Continue with the remaining naval prototype bonuses"
 PRC_OCS.19.t:0 "Cruiser Submarine Design Focus"
 PRC_OCS.19.d:0 "The cruiser submarine concept produced two mutually exclusive refinements. Choose the doctrine we will build around."
 PRC_OCS.19.a:0 "Raiding range: +10% naval range"
 PRC_OCS.19.b:0 "Torpedo punch: +10% torpedo attack"
 PRC_OCS.20.t:0 "Fleet Submarine Design Focus"
 PRC_OCS.20.d:0 "The fleet submarine prototypes split into two mutually exclusive directions. Choose the one our submarine force will adopt."
 PRC_OCS.20.a:0 "Attack & stealth: +5% speed, +5% torpedo, -3% visibility"
 PRC_OCS.20.b:0 "Reliability & protection: +5% reliability, +5% strength, -10% weather penalty"
 PRC_OCS.21.t:0 "Torpedo Cruiser Design Focus"
 PRC_OCS.21.d:0 "The torpedo cruiser can be tuned two mutually exclusive ways. Choose the weapon focus our navy will emphasize."
 PRC_OCS.21.a:0 "Torpedo focus: +10% torpedo hit chance, +15% torpedo attack"
 PRC_OCS.21.b:0 "Secondary battery: +15% gun hit chance, +10% light attack & armor piercing"
 PRC_OCS.22.t:0 "Earthshaker Bomb Prototype Focus"
 PRC_OCS.22.d:0 "Choose the mutually exclusive prototype-reward bonus."
 PRC_OCS.22.a:0 "Naval targeting"
 PRC_OCS.22.a_tt:0 "Large planes: +10% naval-strike targeting."
 PRC_OCS.22.b:0 "Raw power"
 PRC_OCS.22.b_tt:0 "Large planes: +5% naval-strike attack, +5% bombing."
 PRC_OCS.22.c:0 "Both"
 PRC_OCS.22.c_tt:0 "Large planes: +10% naval-strike targeting, +5% naval-strike attack, +5% bombing, +5% cost."
 PRC_OCS.23.t:0 "Helicopter Prototype Focus"
 PRC_OCS.23.d:0 "Choose the mutually exclusive prototype-reward bonus."
 PRC_OCS.23.a:0 "Speed"
 PRC_OCS.23.a_tt:0 "Helicopters: +10% max speed, -5% fuel consumption, -5% cost."
 PRC_OCS.23.b:0 "Compromise"
 PRC_OCS.23.b_tt:0 "Helicopters: +5% reliability."
 PRC_OCS.23.c:0 "Protection"
 PRC_OCS.23.c_tt:0 "Helicopters: +10% armor, +10% defense, +10% breakthrough, +15% fuel consumption, +10% cost."
 PRC_OCS.24.t:0 "Intercontinental Bomber Prototype Focus"
 PRC_OCS.24.d:0 "Choose the mutually exclusive prototype-reward bonus."
 PRC_OCS.24.a:0 "Balanced"
 PRC_OCS.24.a_tt:0 "Intercontinental bombers: +5% reliability."
 PRC_OCS.24.b:0 "Bombing payload"
 PRC_OCS.24.b_tt:0 "Intercontinental bombers: +15% bombing, but -5% air defense and -10% air attack."
 PRC_OCS.24.c:0 "Protection"
 PRC_OCS.24.c_tt:0 "Intercontinental bombers: +15% air defense, but -10% air attack and -10% bombing."
 PRC_OCS.25.t:0 "Mothership Aircraft Prototype Focus"
 PRC_OCS.25.d:0 "Choose the mutually exclusive prototype-reward bonus."
 PRC_OCS.25.a:0 "Speed and agility"
 PRC_OCS.25.a_tt:0 "Motherships: +10% agility, +10% max speed, +15% fuel consumption."
 PRC_OCS.25.b:0 "Reliability"
 PRC_OCS.25.b_tt:0 "Motherships: +10% reliability."
 PRC_OCS.25.c:0 "Strength"
 PRC_OCS.25.c_tt:0 "Motherships: +10% air defense, +10% air attack, +10% cost."
 PRC_OCS.26.t:0 "Stronghold Network — Concrete Reinforcement (I)"
 PRC_OCS.26.d:0 "Choose the mutually exclusive prototype-reward bonus."
 PRC_OCS.26.a:0 "Standardize and document"
 PRC_OCS.26.a_tt:0 "Fortification research: +50% research speed, one use (fortification/construction)."
 PRC_OCS.26.b:0 "Use in current project"
 PRC_OCS.26.b_tt:0 "No bonus; keep the progress for the current project."
 PRC_OCS.27.t:0 "Stronghold Network — Concrete Reinforcement (II)"
 PRC_OCS.27.d:0 "Choose the mutually exclusive prototype-reward bonus."
 PRC_OCS.27.a:0 "Standardize and document"
 PRC_OCS.27.a_tt:0 "Fortification research: +75% research speed, one use (fortification/construction); grants a high land-scientist XP reward when available."
 PRC_OCS.27.b:0 "Use in current project"
 PRC_OCS.27.b_tt:0 "No bonus; keep the progress for the current project."
 PRC_OCS.28.t:0 "Stronghold Network — Communication Overhaul"
 PRC_OCS.28.d:0 "Choose the mutually exclusive prototype-reward bonus."
 PRC_OCS.28.a:0 "Standardize and document"
 PRC_OCS.28.a_tt:0 "Fortification research: +25% research speed, one use (fortification/construction)."
 PRC_OCS.28.b:0 "Use in current project"
 PRC_OCS.28.b_tt:0 "No bonus; keep the progress for the current project."
 PRC_OCS.29.t:0 "Escort Carrier — Design A"
 PRC_OCS.29.d:0 "Choose the mutually exclusive prototype-reward bonus."
 PRC_OCS.29.a:0 "Range"
 PRC_OCS.29.a_tt:0 "Escort carriers: +15% naval range, +5% cost."
 PRC_OCS.29.b:0 "Strength"
 PRC_OCS.29.b_tt:0 "Escort carriers: +5% max strength, +10% reliability."
 PRC_OCS.29.c:0 "Speed"
 PRC_OCS.29.c_tt:0 "Escort carriers: +15% naval speed, +2.5% cost."
