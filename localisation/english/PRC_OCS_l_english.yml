l_english:
 PRC_OCS_category:0 "One-Click Sandbox Start"
 PRC_OCS_category_desc:0 "v2.0 universal stable release. Every human-controlled country can use the technology, equipment, template, stockpile, force-raising and nationwide construction systems. Construction is restricted to states both owned and controlled by the current country. The PRC additionally retains its advisers, configured MIOs, Chinese model names, 23 fixed supply hubs and dual power grids."
 PRC_OCS_initialize:0 "Launch One-Click Sandbox Start"
 PRC_OCS_initialize_desc:0 "For every human-controlled country: completes all technologies and preset doctrines, applies the preset service spirits, boosts existing MIOs, and creates 22 equipment designs, eight division templates and a massive stockpile.\n\n§YInitialization does not alter existing divisions. Use the separate Reorganize Existing Army decision only when you deliberately want to convert the entire army. The PRC additionally retains its advisers, military leadership, four configured MIOs and Chinese model names.§!"
 PRC_OCS_resupply:0 "Replenish Strategic Equipment Stockpile"
 PRC_OCS_resupply_desc:0 "Adds another one million units of every supported land and air equipment type and the appropriate preset variants, while replenishing political power, command power and service experience. The PRC receives its Chinese-named designs; other countries receive neutral designs. Technologies, templates, advisers and designs are not recreated."
 PRC_OCS_reorganize_army:0 "Reorganize Existing Army"
 PRC_OCS_reorganize_army_desc:0 "Converts every existing division of the current country to the preset Garrison Force template. This removes the distinctions of existing armored, mountain, cavalry, marine and other specialized formations and cannot be automatically reversed. §ROnly use it when you deliberately want a uniform army.§!"
 PRC_OCS_unlock_all_shared_slots:0 "Fully Unlock National Building Slots"
 PRC_OCS_unlock_all_shared_slots_desc:0 "Fully unlocks the shared industrial building slots of every state both owned and controlled by the current country to the engine hard cap of §Y25§!. Industrial construction decisions perform the same unlock automatically. Temporarily occupied enemy states are excluded."
 PRC_OCS_queue_transport_and_bases:0 "Develop National Transport and Bases"
 PRC_OCS_queue_transport_and_bases_desc:0 "Only in states both owned and controlled by the current country, develops infrastructure to level 5, air bases to level 10, and existing naval bases to level 10. Occupied enemy territory is excluded.\n\n§YThe PRC additionally retains its 23 fixed strategic supply hubs and dual-grid system: oil-producing regions receive industrial grids, while other regions receive reinforced grids. A grid still waits until refinery, fuel-silo, coastal-dockyard and civilian-industry targets are complete. Other countries receive no power grids and no Chinese fixed supply hubs. Railways are not modified.§!"
 PRC_OCS_queue_national_defenses:0 "Construct Nationwide Defenses"
 PRC_OCS_queue_national_defenses_desc:0 "Grants the basic technology required for state anti-air, then only in states both owned and controlled by the current country develops state anti-air to level 5, land forts to level 10 in every province, and coastal forts to level 10 in coastal provinces. Occupied enemy territory is excluded. Large countries will receive a very large construction queue."
 PRC_OCS_queue_petrochemical_program:0 "National Petrochemical and Fuel Reserve Program"
 PRC_OCS_queue_petrochemical_program_desc:0 "Grants the minimum technologies required for synthetic refineries and fuel silos, then immediately fills both buildings to their vanilla cap of three in every state both owned and controlled by the current country. Each level checks its own slot independently, so partial progress is retained."
 PRC_OCS_queue_coastal_dockyards:0 "Expand Coastal Shipbuilding Industry"
 PRC_OCS_queue_coastal_dockyards_desc:0 "In coastal states both owned and controlled by the current country that have completed both petrochemical targets, queues up to five dockyards one at a time as the third shared-slot priority. Partial progress is retained, and occupied enemy territory is excluded."
 PRC_OCS_queue_civilian_industry:0 "Expand the National Civilian Industry"
 PRC_OCS_queue_civilian_industry_desc:0 "In states both owned and controlled by the current country that have completed the petrochemical targets—and, for coastal states, the dockyard target—queues up to five civilian factories one at a time as the fourth shared-slot priority. Occupied enemy territory is excluded."
 PRC_OCS.1.t:0 "One-Click Sandbox Start Complete"
 PRC_OCS.1.d:0 "The opening setup has been completed.\n\nAll technologies and preset doctrines are unlocked; the officer corps, advisers and service chiefs have been appointed; the four MIOs have completed their configured trait routes; and the Chinese-named designs and eight division templates are in place.\n\nExisting divisions have not been changed. Use the separate reorganization decision only when you want the whole army converted to the Garrison Force template."
 PRC_OCS.1.a:0 "Begin our campaign!"
 PRC_OCS.2.t:0 "All Building Space Opened"
 PRC_OCS.2.d:0 "Land surveys, urban planning and industrial zoning have removed the old construction restrictions from states both owned and controlled by the country. New factory districts, storage zones and transport sites are now available."
 PRC_OCS.2.a:0 "Put every tract of land to work!"
 PRC_OCS.3.t:0 "Transport, Bases and Grids Underway"
 PRC_OCS.3.d:0 "Road, airfield and port expansion has begun across the country. Transport networks and military bases will be developed to support large-scale operations.\n\nAs PRC-only supporting projects, the 23 preset strategic supply hubs will enter service, and eligible regions will receive the dual-grid system after higher-priority industry is complete. Occupied enemy territory is excluded."
 PRC_OCS.3.a:0 "Connect the nation!"
 PRC_OCS.4.t:0 "The National Fuel System Takes Shape"
 PRC_OCS.4.d:0 "Synthetic fuel plants and strategic storage facilities are being developed throughout states both owned and controlled by the country, securing the fuel required by the mechanized army, air force and navy."
 PRC_OCS.4.a:0 "Keep the war machine running!"
 PRC_OCS.5.t:0 "Coastal Shipyards Expanded"
 PRC_OCS.5.d:0 "Shipyards, slipways and supporting industrial districts in our owned and controlled coastal states are being expanded. New naval dockyards will soon enter production."
 PRC_OCS.5.a:0 "A new fleet will be born here!"
 PRC_OCS.6.t:0 "A Nationwide Industrial Boom"
 PRC_OCS.6.d:0 "A civilian factory program has been issued across states both owned and controlled by the country. Workshops, machinery and transport facilities will be organized under a unified plan."
 PRC_OCS.6.a:0 "Build the nation through industry!"
 PRC_OCS.7.t:0 "Generic Opening Initialization Complete"
 PRC_OCS.7.d:0 "The generic initialization is complete.\n\nAll technologies and preset doctrines are unlocked, the selected service spirits are active, existing MIOs have received size and funds, and 22 neutral equipment designs, eight division templates and a massive stockpile are available.\n\nExisting divisions have not been changed. Use the separate reorganization decision only when you want the whole army converted to the Garrison Force template. Non-PRC countries receive no PRC advisers, configured PRC MIO traits or Chinese model names."
 PRC_OCS.7.a:0 "Begin the war!"
 PRC_OCS.8.t:0 "Army Reorganization Complete"
 PRC_OCS.8.d:0 "The reorganization order has been carried out. Every active army division now uses the preset Garrison Force template, and the former distinctions between armored, cavalry, mountain, airborne and amphibious formations have been removed.\n\nStandardization will simplify reinforcement and command, but specialized formations will have to be rebuilt later."
 PRC_OCS.8.a:0 "Standardize equipment and command!"
 PRC_OCS.9.t:0 "Nationwide Defenses Under Construction"
 PRC_OCS.9.d:0 "State anti-air positions, permanent land forts and coastal defenses are now under construction throughout states both owned and controlled by the country. Cities, transport nodes, frontier sectors and landing grounds will be incorporated into a unified defense plan."
 PRC_OCS.9.a:0 "Build an unbreakable defensive line!"
 PRC_OCS.10.t:0 "National Transport and Base Program Underway"
 PRC_OCS.10.d:0 "Roads, airfields and existing ports in states both owned and controlled by the country are now part of a unified expansion plan. The network will support industrial transport, troop movements and long-range operations.\n\nOccupied enemy territory is excluded, and this generic decision grants no power grids or Chinese fixed supply hubs."
 PRC_OCS.10.a:0 "Open the national arteries!"
 PRC_OCS_raise_24_infantry_divisions:0 "Raise 24 Full-Strength Main Infantry Divisions"
 PRC_OCS_raise_24_infantry_divisions_desc:0 "Raises §Y24§! divisions using the preset Main Infantry Division template in one state both owned and controlled by the country. Every division enters service with §Y100% manpower, 100% equipment and full starting training§!. The PRC uses its existing militia-based version; every other country uses the regular-infantry version. The AI cannot use this one-time decision."
 PRC_OCS.11.t:0 "Twenty-Four Main Infantry Divisions Raised"
 PRC_OCS.11.d:0 "Recruits, weapons and supporting materiel have been assembled. Twenty-four full-strength main infantry divisions have completed formation in controlled territory and entered the order of battle with full manpower, equipment and training."
 PRC_OCS.11.a:0 "Commit them to battle!"
