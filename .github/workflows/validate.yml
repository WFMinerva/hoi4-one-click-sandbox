name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 静态检查
        run: python tools/validate_mod.py
      - name: 检查器回归测试
        run: python -m unittest tools.test_validate_mod
      - name: MIO 生成器一致性
        run: python tools/generate_universal_mio_effect.py --check --no-vanilla
      - name: 构建发布包
        run: python tools/build_release.py
      - name: 验证重复构建结果一致
        shell: bash
        # main 单主干后测试版也会推到 main：按 descriptor.mod 版本号选择
        # 测试版/正式版包名，否则 glob 匹配为空导致 sha256sum 失败；
        # glob 带版本号避免 dist 残留多版本包时多行哈希干扰比对。
        run: |
          version="$(grep -m1 -oE '^version="[^"]+"' descriptor.mod | cut -d'"' -f2)"
          case "$version" in *test*) pkg="测试版" ;; *) pkg="正式版" ;; esac
          first_hash="$(sha256sum dist/*_v${version}_${pkg}.zip | cut -d ' ' -f 1)"
          python tools/build_release.py
          second_hash="$(sha256sum dist/*_v${version}_${pkg}.zip | cut -d ' ' -f 1)"
          test "$first_hash" = "$second_hash"
