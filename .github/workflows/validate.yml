name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 静态检查
        run: python tools/validate_mod.py
      - name: 检查器回归测试
        run: python -m unittest tools/test_validate_mod.py
      - name: MIO 生成器一致性
        run: python tools/generate_universal_mio_effect.py --check
      - name: 构建发布包
        run: python tools/build_release.py
      - name: 验证重复构建结果一致
        shell: bash
        run: |
          first_hash="$(sha256sum dist/*_正式版.zip | cut -d ' ' -f 1)"
          python tools/build_release.py
          second_hash="$(sha256sum dist/*_正式版.zip | cut -d ' ' -f 1)"
          test "$first_hash" = "$second_hash"
